application:
  subdomain: lms
  background_task: true
  multi_instance: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://lms:5082/
services:
  lms:
    # epoupon/lms:3.71.0
    # upstream: epoupon/lms:3.80.0
    image: registry.lazycat.cloud/czyt/epoupon/lms:6b574b9ebe5a26ac
    user: 1000
    binds:
      - /lzcapp/documents/music:/music
      - /lzcapp/var/lms:/var/lms
    setup_script: |
      chown -R 1000:1000 /var/lms
ext_config:
  enable_document_access: true
  enable_media_access: true
