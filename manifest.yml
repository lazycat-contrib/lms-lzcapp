lzc-sdk-version: "0.1"
name: LMS
package: cloud.lazycat.app.lms
version: 3.64.0
description: 轻量级音乐服务器
homepage: https://github.com/epoupon/lms
author: epoupon
application:
  subdomain: lms
  background_task: false
  multi_instance: true
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  routes:
    - /=http://lms.cloud.lazycat.app.lms.lzcapp:5082/
services:
  lms:
    image: registry.lazycat.cloud/czyt/epoupon/lms:e47b879ae463b79b
    user: 1000
    binds:
      - /lzcapp/run/mnt/home/music:/music
      - /lzcapp/var/lms:/var/lms
    setup_script: |
      chown -R 1000:1000 /var/lms
