name: LMS
package: cloud.lazycat.app.lms
version: 3.71.0
min_os_version: 1.3.8
description: 轻量级音乐服务器。通过网页界面访问您自托管的音乐。
homepage: https://github.com/epoupon/lms
author: epoupon
application:
  subdomain: lms
  background_task: true
  multi_instance: true
  public_path:
    - /
  routes:
    - /=http://lms:5082/
services:
  lms:
    # epoupon/lms:3.71.0
    image: registry.lazycat.cloud/czyt/epoupon/lms:2465d08203bc3aae
    user: 1000
    binds:
      - /lzcapp/document/music:/music
      - /lzcapp/var/lms:/var/lms
    setup_script: |
      chown -R 1000:1000 /var/lms

ext_config:
  enable_document_access: true
  enable_media_access: true

locales:
  zh:
    name: "LMS"
    description: "轻量级音乐服务器。通过网页界面访问您自托管的音乐。"
  en:
    name: "LMS"
    description: "Lightweight Music Server. Access your self-hosted music using a web interface."
